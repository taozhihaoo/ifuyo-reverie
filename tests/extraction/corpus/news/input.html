<h1>本市地铁十号线全线贯通 试行一周客流平稳</h1>
<p class="byline">记者 林晓</p>
<p>本报讯 昨日上午，地铁十号线最后一座车站通过验收，标志着全线贯通。运营方表示，试行一周以来日均客流约二十二万人次，运行秩序平稳。</p>
<p>十号线全长三十八公里，共设二十六座车站，其中换乘站九座。全线贯通后，从城东到城西的通勤时间由原来的七十分钟缩短至四十五分钟。</p>
<p>沿线居民王女士说，过去上班需要换乘两次，现在一车直达，"每天能多睡二十分钟"。</p>
<p>运营方提醒，新站投入初期可能根据客流微调班次，乘客可通过官方应用查询实时信息。</p>
</article>
