<article>
<h1>城市屋顶摄影集：十个天台与一场日落</h1>
<p>这个秋天我爬了十栋楼的屋顶，等一场总是迟到的日落。以下是全部十张照片与当时的短记。</p>
<figure><img src="https://photos.cityroofs.example/01.jpg" alt="01"><figcaption>01 · 水塔与鸽子</figcaption></figure>
<p>第一栋楼只有水塔和一群把水塔当终点线的鸽子。</p>
<figure><img src="https://photos.cityroofs.example/02.jpg" alt="02"><figcaption>02 · 天线森林</figcaption></figure>
<p>老城区的天线比树还密，像一片金属森林。</p>
<figure><img src="https://photos.cityroofs.example/03.jpg" alt="03"><figcaption>03 · 红色楼梯</figcaption></figure>
<p>消防梯刷成了红色，在灰色屋顶中间像一句感叹号。</p>
<figure><img src="https://photos.cityroofs.example/04.jpg" alt="04"><figcaption>04 · 菜园</figcaption></figure>
<p>有人在楼顶种了小葱和辣椒，用泡沫箱当花盆。</p>
<figure><img src="https://photos.cityroofs.example/05.jpg" alt="05"><figcaption>05 · 猫</figcaption></figure>
<p>一只猫在女儿墙上走完全程，目不斜视。</p>
<figure><img src="https://photos.cityroofs.example/06.jpg" alt="06"><figcaption>06 · 玻璃幕墙的倒影</figcaption></figure>
<p>新楼的玻璃幕墙把旧城映得支离破碎。</p>
<figure><img src="https://photos.cityroofs.example/07.jpg" alt="07"><figcaption>07 · 晾衣绳</figcaption></figure>
<p>傍晚六点，晾衣绳上的床单先于城市亮起来。</p>
<figure><img src="https://photos.cityroofs.example/08.jpg" alt="08"><figcaption>08 · 停水通知</figcaption></figure>
<p>手写停水通知贴在水箱旁，日期是三年前。</p>
<figure><img src="https://photos.cityroofs.example/09.jpg" alt="09"><figcaption>09 · 云</figcaption></figure>
<p>等了两个小时，云先红了起来。</p>
<figure><img src="https://photos.cityroofs.example/10.jpg" alt="10"><figcaption>10 · 日落</figcaption></figure>
<p>日落只持续了六分钟。值得。</p>
